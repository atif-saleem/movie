<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashif Saleem - Wedding Memories</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #d97706;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
        }

        header {
            text-align: center;
            padding: 16px 8px;
            margin-bottom: 12px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Video Container - Responsive 16:9 Aspect Ratio */
        .main-player-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .fullscreen-btn {
            background: var(--accent-gold);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Event Selection List */
        .section-title {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .playlist-item {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .playlist-item:hover, .playlist-item.active {
            border-color: var(--accent-gold);
            background: #283548;
        }

        .playlist-item .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .playlist-item .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(217, 119, 6, 0.15);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .playlist-item.active .icon {
            background: var(--accent-gold);
            color: #fff;
        }

        .playlist-item span {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .play-indicator {
            font-size: 0.8rem;
            color: var(--accent-gold);
            display: none;
        }

        .playlist-item.active .play-indicator {
            display: block;
        }

        footer {
            margin-top: auto;
            padding: 20px 0 10px 0;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Media Query for Desktop Optimization */
        @media (min-width: 768px) {
            body {
                max-width: 900px;
                margin: 0 auto;
                padding: 24px;
            }

            header h1 {
                font-size: 2rem;
            }

            .player-info h2 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Kashif Saleem Wedding</h1>
        <p>Celebration Memories & Event Videos</p>
    </header>

    <main>
        <!-- Main Video Card -->
        <section class="main-player-card">
            <div class="video-wrapper" id="videoContainer">
                <iframe 
                    id="mainPlayer" 
                    src="https://drive.google.com/file/d/1rcPWyrEr3IPRQKyexuJiQMqmIVlYHupR/preview" 
                    allow="autoplay; fullscreen" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="player-info">
                <h2 id="currentTitle">Previous Wedding Memories</h2>
                <button class="fullscreen-btn" onclick="openFullScreen()">
                    <span> Fullscreen</span>
                </button>
            </div>
        </section>

        <!-- Playlist Section -->
        <h3 class="section-title">Select Event</h3>
        <section class="playlist" id="playlist">

            <div class="playlist-item active" onclick="playVideo('1rcPWyrEr3IPRQKyexuJiQMqmIVlYHupR', 'Previous Wedding Memories', this)">
                <div class="title-group">
                    <div class="icon">&#9654;</div>
                    <span>Previous Wedding Memories</span>
                </div>
                <div class="play-indicator">Playing</div>
            </div>

            <div class="playlist-item" onclick="playVideo('1ip4fmeNw7FB4lUht_4HTNJjJM3t87cHS', 'Barat Celebration', this)">
                <div class="title-group">
                    <div class="icon">&#9654;</div>
                    <span>Barat Celebration</span>
                </div>
                <div class="play-indicator">Playing</div>
            </div>

            <div class="playlist-item" onclick="playVideo('1p2RXktJmJ0toFE8WGleOCakwbxensq8L', 'Walima Celebration', this)">
                <div class="title-group">
                    <div class="icon">&#9654;</div>
                    <span>Walima Celebration</span>
                </div>
                <div class="play-indicator">Playing</div>
            </div>

            <div class="playlist-item" onclick="playVideo('1rkgvbP6KU3l1WvpOtFEY6BKDqAeQAg27', 'Groom\'s Mehndi', this)">
                <div class="title-group">
                    <div class="icon">&#9654;</div>
                    <span>Groom's Mehndi</span>
                </div>
                <div class="play-indicator">Playing</div>
            </div>

            <div class="playlist-item" onclick="playVideo('12gEOdghSYReH-Qd9KoQUxZFlB47b1Pqz', 'Bride\'s Mehndi', this)">
                <div class="title-group">
                    <div class="icon">&#9654;</div>
                    <span>Bride's Mehndi</span>
                </div>
                <div class="play-indicator">Playing</div>
            </div>

        </section>
    </main>

    <footer>
        &copy; Kashif Saleem Wedding Gallery
    </footer>

    <script>
        // Function to switch active video
        function playVideo(fileId, title, element) {
            const player = document.getElementById('mainPlayer');
            const titleElement = document.getElementById('currentTitle');
            
            // Set embedded preview URL
            player.src = `https://drive.google.com/file/d/${fileId}/preview`;
            titleElement.innerText = title;

            // Highlight active video item in list
            const items = document.querySelectorAll('.playlist-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            // Smooth scroll up to player on mobile
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Native Fullscreen handler for mobile and desktop browsers
        function openFullScreen() {
            const container = document.getElementById('videoContainer');

            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) { /* Safari & iOS */
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) { /* IE11 */
                container.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
